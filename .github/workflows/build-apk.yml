name: Build Pulse Chat APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          accept-android-sdk-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: |
          SDK_PATH="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "sdk.dir=$SDK_PATH" > local.properties

      - name: Decode debug keystore
        run: |
          mkdir -p app
          if [ -f keystore/pulse-debug.b64 ]; then
            base64 -d keystore/pulse-debug.b64 > app/pulse-debug.keystore
            ls -la app/pulse-debug.keystore
            keytool -list -keystore app/pulse-debug.keystore -alias pulsechat -storepass android || true
          else
            echo "No keystore — using default debug"
          fi

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          set -o pipefail
          if [ -x "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log
          else
            gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log
          fi

      - name: Show compile errors
        if: failure()
        run: |
          echo "===== ERRORS ====="
          grep -E "e: |error:|FAILED|Unresolved|What went wrong" build.log | tail -80 || true
          echo "===== TAIL ====="
          tail -100 build.log || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: PulseChat-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
